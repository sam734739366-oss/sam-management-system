name: Release

# Publishing the installers from GitHub's own runners.
#
# Why not from a local machine: this link sustains only ~75 KB/s in both
# directions, and GitHub aborts any upload request whose body is still
# streaming after ~10 minutes ("408 Upload body timed out due to
# inactivity"). A ~93 MB installer cannot be pushed from here in one
# request. The runner has a fast link, so the build and the upload both
# happen on GitHub.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A plain syntax error in one of our scripts used to fail the release
      # at the very last step, AFTER the installers were already published —
      # which left a half-done release and a red build. This step catches it
      # in the first minute instead, with a clear message.
      - name: Syntax-check the sources and the scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path src, tools -Recurse -Filter *.js | Select-Object -ExpandProperty FullName
          $bad = 0
          foreach ($f in $files) {
            node --check $f
            if ($LASTEXITCODE -ne 0) { $bad = 1; Write-Host "BROKEN: $f" }
          }
          if ($bad -ne 0) { throw "a script has a syntax error — the release stops here" }
          Write-Host ("checked {0} files — all good" -f $files.Count)

      - name: Rebuild better-sqlite3 for the Electron ABI
        run: npm run rebuild:native

      - name: Build the installers (no publishing yet)
        env:
          # the token is still here so the github publish config resolves
          # exactly as it does in a normal build — nothing is uploaded
          # because --publish never turns the publishing off.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --x64 --publish never

      # electron-builder makes one publisher per target (nsis + portable) and
      # they race each other to create the release — GitHub then holds TWO
      # releases with the same tag, and the page shows only one of them.
      # So the build never publishes; this step publishes once, for real.
      - name: Publish the release (a single release, no duplicates)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: 'true'
        run: node tools/publish-release.js

      - name: Arabic release title and notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/set-release-meta.js

      - name: Release summary
        if: always()
        shell: pwsh
        run: Get-ChildItem -Path dist -File | Select-Object Name, Length
